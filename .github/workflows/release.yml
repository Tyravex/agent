name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $VERSION"
            exit 1
          fi

          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "Tag $TAG does not match VERSION $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        run: go test ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: verify
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            extension: ".exe"
            archive: zip

          - goos: linux
            goarch: amd64
            extension: ""
            archive: tar.gz

          - goos: linux
            goarch: arm64
            extension: ""
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p dist/package

          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          LDFLAGS="-X github.com/Tyravex/agent/internal/version.Number=$VERSION"
          LDFLAGS="$LDFLAGS -X github.com/Tyravex/agent/internal/version.Commit=$COMMIT"
          LDFLAGS="$LDFLAGS -X github.com/Tyravex/agent/internal/version.BuildDate=$BUILD_DATE"

          go build \
            -trimpath \
            -ldflags "$LDFLAGS" \
            -o "dist/package/tyravex-agent${{ matrix.extension }}" \
            ./cmd/tyravex-agent

          cp config.example.yml dist/package/
          cp VERSION dist/package/
          cp README.md dist/package/

      - name: Package ZIP
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd dist/package
          zip -9 "../tyravex-agent-v${{ needs.verify.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip" *

      - name: Package TAR.GZ
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          tar -czf \
            "dist/tyravex-agent-v${{ needs.verify.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" \
            -C dist/package .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - verify
      - build

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha256sum *.zip *.tar.gz > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "v$VERSION" \
            release/*.zip \
            release/*.tar.gz \
            release/SHA256SUMS \
            --repo "$REPOSITORY" \
            --title "Tyravex Agent v$VERSION" \
            --generate-notes \
            --verify-tag