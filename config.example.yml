
# Tyravex Agent configuration
# Copy to config.yml and fill in your values.
# Never commit config.yml to Git.

panel:
  url: "https://panel.example.com"

node:
  id: "YOUR_NODE_ID"
  token: "YOUR_NODE_TOKEN"

heartbeat:
  interval: "30s"

docker:
  enabled: true

  # Windows / Docker Desktop:
  # host: "npipe:////./pipe/docker_engine"

  # Linux:
  # host: "unix:///var/run/docker.sock"

  host: ""

api:
  # Only loopback addresses are accepted.
  listen: "127.0.0.1:8080"

  # Generate a separate random token (at least 32 characters).
  # Must differ from node.token.
  token: "REPLACE_WITH_A_SEPARATE_RANDOM_API_TOKEN"
